plugins {
    id 'java'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'com.gtnewhorizons.retrofuturagradle'

version = '0.1.0-alpha'
group = 'net.createmod.ponder'

def modVersion = '0.1.0-alpha'

base {
    archivesName.set('Ponder-MMCE-1.12.2')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    withSourcesJar()
}

sourceSets {
    clientHarness {
        java.srcDir 'verification/client-harness/src/main/java'
        resources.srcDir 'verification/client-harness/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    serverHarness {
        java.srcDir 'verification/server-harness/src/main/java'
        resources.srcDir 'verification/server-harness/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
        content {
            includeGroup 'zone.rong'
            includeGroup 'com.cleanroommc'
            includeGroup 'io.github.llamalad7'
        }
    }
}

def mmceJarOverride = providers.gradleProperty('mmceJar').orNull
def mmceDependency
if (mmceJarOverride != null && !mmceJarOverride.trim().isEmpty()) {
    File localMmce = rootProject.file(mmceJarOverride)
    if (!localMmce.isFile()) {
        throw new GradleException("MMCE jar override does not exist: ${localMmce}")
    }
    logger.lifecycle("Ponder-MMCE compiling against local MMCE jar: ${localMmce}")
    mmceDependency = files(localMmce)
} else {
    mmceDependency = 'curse.maven:modularmachinery-community-edition-817377:7372951'
}

dependencies {
    implementation project(':')

    compileOnly mmceDependency
    compileOnly('maven.modrinth:crafttweaker:4.1.20.698') {
        transitive = false
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:2.28.2'
    testCompileOnly mmceDependency
    testRuntimeOnly mmceDependency
    testRuntimeOnly('maven.modrinth:crafttweaker:4.1.20.698') {
        transitive = false
    }
}

processResources {
    inputs.property 'version', modVersion
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand 'version': modVersion, 'mcversion': '1.12.2'
    }
}

jar {
    archiveClassifier.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
    manifest {
        attributes([
            'Specification-Title': 'Ponder-MMCE',
            'Specification-Vendor': 'Ponder Legacy contributors',
            'Specification-Version': '1',
            'Implementation-Title': 'Ponder-MMCE',
            'Implementation-Version': modVersion,
            'Implementation-Vendor': 'Ponder Legacy contributors',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

tasks.withType(Test).configureEach {
    useJUnit()
}

tasks.register('smokePack', Zip) {
    archiveBaseName.set('Ponder-MMCE-Smoke-Pack')
    archiveVersion.set(modVersion)
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    from layout.projectDirectory.dir('examples/smoke')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('clientHarnessJar', Jar) {
    dependsOn tasks.named('clientHarnessClasses')
    archiveBaseName.set('Ponder-MMCE-Client-Harness-1.12.2')
    archiveVersion.set(modVersion)
    archiveClassifier.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
    from sourceSets.clientHarness.output
}

tasks.register('serverHarnessJar', Jar) {
    dependsOn tasks.named('serverHarnessClasses')
    archiveBaseName.set('Ponder-MMCE-Server-Harness-1.12.2')
    archiveVersion.set(modVersion)
    archiveClassifier.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
    from sourceSets.serverHarness.output
}

def reobfMmceJar = tasks.named('reobfJar',
    com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar)
reobfMmceJar.configure {
    archiveBaseName.set('Ponder-MMCE-1.12.2')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
}

def reobfClientHarnessJar = tasks.register('reobfClientHarnessJar',
    com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar) {
    def inputJar = tasks.named('clientHarnessJar', Jar)
    dependsOn inputJar, reobfMmceJar
    setInputJarFromTask(inputJar)
    mcVersion.set(reobfMmceJar.flatMap { it.mcVersion })
    srg.set(reobfMmceJar.flatMap { it.srg })
    fieldCsv.set(reobfMmceJar.flatMap { it.fieldCsv })
    methodCsv.set(reobfMmceJar.flatMap { it.methodCsv })
    exceptorCfg.set(reobfMmceJar.flatMap { it.exceptorCfg })
    recompMcJar.set(reobfMmceJar.flatMap { it.recompMcJar })
    extraSrgEntries.set(reobfMmceJar.flatMap { it.extraSrgEntries })
    extraSrgFiles.from(reobfMmceJar.map { it.extraSrgFiles })
    referenceClasspath.from(reobfMmceJar.map { it.referenceClasspath })
    archiveBaseName.set('Ponder-MMCE-Client-Harness-1.12.2')
    archiveVersion.set(modVersion)
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('verification/client-harness'))
}

def reobfServerHarnessJar = tasks.register('reobfServerHarnessJar',
    com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar) {
    def inputJar = tasks.named('serverHarnessJar', Jar)
    dependsOn inputJar, reobfMmceJar
    setInputJarFromTask(inputJar)
    mcVersion.set(reobfMmceJar.flatMap { it.mcVersion })
    srg.set(reobfMmceJar.flatMap { it.srg })
    fieldCsv.set(reobfMmceJar.flatMap { it.fieldCsv })
    methodCsv.set(reobfMmceJar.flatMap { it.methodCsv })
    exceptorCfg.set(reobfMmceJar.flatMap { it.exceptorCfg })
    recompMcJar.set(reobfMmceJar.flatMap { it.recompMcJar })
    extraSrgEntries.set(reobfMmceJar.flatMap { it.extraSrgEntries })
    extraSrgFiles.from(reobfMmceJar.map { it.extraSrgFiles })
    referenceClasspath.from(reobfMmceJar.map { it.referenceClasspath })
    archiveBaseName.set('Ponder-MMCE-Server-Harness-1.12.2')
    archiveVersion.set(modVersion)
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('verification/server-harness'))
}

tasks.register('verifyJava8Bytecode') {
    dependsOn tasks.named('classes'), tasks.named('testClasses'),
        tasks.named('clientHarnessClasses'), tasks.named('serverHarnessClasses')
    doLast {
        [
            layout.buildDirectory.dir('classes/java/main'),
            layout.buildDirectory.dir('classes/java/test'),
            layout.buildDirectory.dir('classes/java/clientHarness'),
            layout.buildDirectory.dir('classes/java/serverHarness')
        ].each { directory ->
            fileTree(directory).matching { include '**/*.class' }.each { file ->
                file.withInputStream { input ->
                    byte[] header = new byte[8]
                    if (input.read(header) != 8 || (header[6] & 0xff) != 0 || (header[7] & 0xff) != 52) {
                        throw new GradleException("Non-Java-8 bytecode: ${file}")
                    }
                }
            }
        }
    }
}

tasks.register('verifyModuleContents') {
    dependsOn reobfMmceJar
    doLast {
        File archive = reobfMmceJar.get().archiveFile.get().asFile
        File metadata = zipTree(archive).matching { include 'mcmod.info' }.singleFile
        String text = metadata.getText('UTF-8')
        [
            '"modid": "ponder_mmce"',
            'required-after:ponder_legacy@[1.1.2,)',
            'after:modularmachinery',
            'required-after:crafttweaker@[4.1.20,)'
        ].each { expected ->
            if (!text.contains(expected)) {
                throw new GradleException("Ponder-MMCE metadata is missing ${expected}")
            }
        }
        [
            'hellfirepvp/modularmachinery/',
            'crafttweaker/',
            'stanhebben/zenscript/',
            'net/createmod/ponder/api/'
        ].each { forbidden ->
            if (!zipTree(archive).matching { include "${forbidden}**" }.isEmpty()) {
                throw new GradleException("Ponder-MMCE jar embeds provided dependency ${forbidden}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyJava8Bytecode')
}

tasks.named('assemble') {
    dependsOn reobfMmceJar, tasks.named('verifyModuleContents'), tasks.named('smokePack'),
        reobfClientHarnessJar, reobfServerHarnessJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact reobfMmceJar
            artifact tasks.named('sourcesJar')
            artifactId = 'Ponder-MMCE-1.12.2'
            version = modVersion
            pom.withXml {
                def dependencies = asNode().appendNode('dependencies')
                [
                    ['net.createmod.ponder', 'Ponder-1.12.2', '[1.1.2-mc1.12.2,)', 'provided'],
                    ['curse.maven', 'modularmachinery-community-edition-817377', '7372951', 'provided'],
                    ['maven.modrinth', 'crafttweaker', '4.1.20.698', 'provided']
                ].each { values ->
                    def dependency = dependencies.appendNode('dependency')
                    dependency.appendNode('groupId', values[0])
                    dependency.appendNode('artifactId', values[1])
                    dependency.appendNode('version', values[2])
                    dependency.appendNode('scope', values[3])
                }
            }
        }
    }
}
